[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py315"

select = [
    "E",
    "F",
    "B",
    "COM",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "A",
    "C",
    "DTZ",
    "T100",
    "DJ",
    "EM",
    "EXE",
    "FIX",
    "FA",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "INP001",
    "PIE",
    "PYI",
    "PT",
    "Q",
    "RSE102",
    "RET",
    "SLF001",
    "SIM",
    "SLOT",
    "TID",
    "TD",
    "TC",
    "ARG",
    "PTH",
    "FLY002",
    "I",
    "C901",
    "NPY",
    "PD",
    "PERF",
    "W",
    "DOC",
    "D",
    "PGH",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "FURB",
    "RUF",
    "TRY",
]
ignore = [
    "D202",   # Space after function docstring is allowed
    "D100",   # docstring in public module
    "D101",   # docstring in public class
    "D102",   # docstring in public method
    "D103",   # docstring in public function
    "D104",   # docstring in public package
    "D107",   # docstring in __init__
    "RSE102", # we want to allow raising Error() with the ()
    "D401",   # Prefer descriptive third-person docstrings: "Returns..." over imperative "Return...".
    "D212",   # Prefer multiline docstring summary on the second line.
    "TD002",  # Prefer no author with TODO
    "TD003",  # Prefer no link with TODO
    "FIX002", # Prefer no TODO fixing nagging
    "ARG002", # Prefer no reporting of unused method argument; clashes with Protocol
    "TRY003", # We might think about more specific *Error types later...
    "EM101",  # Preconstructing error message if raise is single line is pedantic.
    "EM102",  # Sadly no alternative rule to EM101/102 to report multiline raise, which would be great.
    "TC006",  # We prefer no quotes around type names for cast
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "INP001", # No __init__.py for tests
    "S101",   # assert is allowed for tests
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
